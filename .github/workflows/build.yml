name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Generate Project Structure & Shizuku GFX Support
      run: |
        # 1. Create root settings.gradle.kts
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Dark-killer"
        include(":app")
        EOF

        # 2. Create root build.gradle.kts
        cat << 'EOF' > build.gradle.kts
        plugins {
            id("com.android.application") version "8.5.2" apply false
        }
        EOF

        # 3. Create app/build.gradle.kts (No license checks, direct Shizuku & Storage ready)
        mkdir -p app/src/main
        cat << 'EOF' > app/build.gradle.kts
        plugins {
            id("com.android.application")
        }

        android {
            namespace = "com.darkkiller.app"
            compileSdk = 34

            defaultConfig {
                applicationId = "com.darkkiller.app"
                minSdk = 24
                targetSdk = 34
                versionCode = 1
                versionName = "3.1"
            }
        }

        dependencies {
            implementation("androidx.appcompat:appcompat:1.6.1")
            implementation("com.google.android.material:material:1.9.0")
            // Shizuku API dependency can be added here for .pak file access
        }
        EOF

        # 4. Create basic AndroidManifest.xml with storage/Shizuku permissions
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />
            <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
            
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:label="DARKKILLER"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 5. Create gradle.properties
        echo 'android.useAndroidX=true' > gradle.properties

        # 6. Create MainActivity with Game Version Selector & Shizuku Pak Modifier Hook
        mkdir -p app/src/main/java/com/darkkiller/app
        cat << 'EOF' > app/src/main/java/com/darkkiller/app/MainActivity.kt
        package com.darkkiller.app

        import android.os.Bundle
        import android.widget.Button
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                
                // Simple layout generation for testing core functions
                val btnLayout = Button(this).apply {
                    text = "Apply Full Brutal Pak (Shizuku)"
                    setOnClickListener {
                        Toast.makeText(this@MainActivity, "Applying .pak via Shizuku...", Toast.LENGTH_SHORT).show()
                    }
                }
                setContentView(btnLayout)
            }
        }
        EOF

    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
